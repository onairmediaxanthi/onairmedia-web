name: Deploy

# Κάθε push στο main ανεβαίνει στο new.onairmedia.gr (staging).
# Η μετάβαση στο onairmedia.gr θα γίνει αργότερα με ξεχωριστό στόχο.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SSH_HOST: s657.srvx.ws
  SSH_USER: onairmedia
  SSH_PORT: 22
  APP_DIR: /home/onairmedia/apps/onairmedia-web
  WEB_DIR: /home/onairmedia/new.onairmedia.gr

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_sqlite, zip, gd, exif, sodium
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, mbstring, pdo_mysql, zip, gd, exif, sodium
          coverage: none

      - name: Composer (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build assets
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload application
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $SSH_PORT"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR'"
          rsync -az --delete -e "$SSH" \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='tests/' --exclude='.env' --exclude='storage/' \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Release on server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' WEB_DIR='$WEB_DIR' bash '$APP_DIR/deploy/release.sh'"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
